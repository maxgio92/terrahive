name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    name: enable auto-merge for patch updates
    runs-on: ubuntu-latest
    # Only Dependabot PRs qualify; guard so no other actor triggers this.
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write # let GitHub complete the merge once checks pass
      pull-requests: write # enable auto-merge on the PR
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge only patch-level bumps. GitHub still requires the PR's
      # checks to pass before the merge completes, so this is not a bypass.
      - name: enable auto-merge for patch updates
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
