name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, vet, build, unit tests (lean)
    runs-on: ubuntu-latest
    # Job-level boolean so the step `if` can read it (a step cannot see its
    # own step-level env). The token itself stays out of job env and is
    # passed only to the Codecov step, so other steps never see it.
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build (lean)
        run: go build ./...

      # Unit tests with the race detector and coverage. The cover target is
      # provided by the build tooling and writes a coverage profile.
      - name: unit tests with coverage and race (lean)
        run: make cover

      - name: upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lean
          path: coverage.out
          if-no-files-found: error

      # Codecov upload is a no-op when no token is set, so forks and
      # token-less runs stay green.
      - name: upload coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  validate-examples:
    name: validate examples
    runs-on: ubuntu-latest
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: validate examples
        run: make validate-examples

  bumble:
    name: build and unit tests (bumble)
    runs-on: ubuntu-latest
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Fetches the pinned TinyGo release into the go:embed tree.
      - name: fetch TinyGo toolchain
        run: make fetch-tinygo

      - name: go build (bumble)
        run: make build-bumble

      - name: unit tests (bumble)
        run: go test -tags bumble ./...

  acceptance:
    name: acceptance tests (privileged)
    # TF_ACC acceptance tests load real BPF programs, so they need a
    # privileged runner with root or CAP_BPF and a bpffs mount. The
    # GitHub-hosted ubuntu runner grants passwordless sudo, which is
    # enough; a self-hosted runner works too as long as it can mount bpffs.
    #
    # Kernel version note: these tests exercise the running kernel's BPF
    # features. GitHub-hosted ubuntu-latest ships a 6.x kernel, but hosted
    # runners do not let us select the kernel, so we cannot run a real
    # kernel-version matrix here.
    # TODO: add a kernel matrix once self-hosted runners (or VM images with
    # selectable kernels) are available; hosted runners cannot vary it.
    runs-on: ubuntu-latest
    steps:
      - name: harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: record kernel version
        run: uname -a

      - name: mount bpffs
        run: |
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpf /sys/fs/bpf
          fi

      # Run as root so the process can call the bpf() syscall. Keep PATH so
      # sudo finds the go installed by setup-go, and pass TF_ACC through.
      - name: acceptance tests
        run: sudo env "PATH=$PATH" TF_ACC=1 go test ./... -v -timeout 20m
