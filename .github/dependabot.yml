version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Version updates: one grouped PR for all non-security bumps.
      go-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates: one grouped PR for all advisory-driven bumps.
      # Requires Dependabot security updates enabled in repo settings.
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
