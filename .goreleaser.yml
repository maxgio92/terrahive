version: 2
project_name: terraform-provider-terrahive

builds:
  - id: lean
    binary: "{{ .ProjectName }}_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  # The bumble flavor embeds the pinned TinyGo toolchain; the pre-hook
  # fetches the release into the go:embed tree before compiling.
  - id: bumble
    binary: "{{ .ProjectName }}-bumble_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - bumble
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      pre:
        - make fetch-tinygo TINYGO_ARCH={{ .Arch }}

archives:
  - id: lean
    ids: [lean]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: bumble
    ids: [bumble]
    formats: [zip]
    name_template: "{{ .ProjectName }}-bumble_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
