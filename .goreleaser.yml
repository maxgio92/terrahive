version: 2
project_name: terraform-provider-terrahive

builds:
  - id: lean
    binary: "{{ .ProjectName }}_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  # The bumble flavor embeds the pinned TinyGo toolchain; the pre-hook
  # fetches the release into the go:embed tree before compiling.
  - id: bumble
    binary: "{{ .ProjectName }}-bumble_v{{ .Version }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - bumble
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos:
      - linux
    goarch:
      - amd64
    hooks:
      pre:
        - make fetch-tinygo TINYGO_ARCH={{ .Arch }}

archives:
  - id: lean
    ids: [lean]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: bumble
    ids: [bumble]
    formats: [zip]
    name_template: "{{ .ProjectName }}-bumble_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

# SBOMs for each archive, generated with syft (goreleaser default tool).
sboms:
  - id: archive
    artifacts: archive

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  use: github
  sort: asc
  # Group entries by conventional-commit type.
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Dependencies
      regexp: '^.*?chore\(deps\).+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - "Merge pull request"
      - "Merge branch"
